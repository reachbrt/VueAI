[build]
  publish = "demo/dist"
  command = "npm install && npm run build --workspace @aivue/summarizer && npm run build --workspace @aivue/translate && npm run build --workspace @aivue/moderation && npm run build --workspace @aivue/writer && cd demo && npm install && npm run build"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--production=false"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
