[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--production=false"

[[redirects]]
  from = "/assets/architecture-WoRcel7K.svg"
  to = "/architecture.svg"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
